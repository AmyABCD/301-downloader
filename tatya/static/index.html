<!doctype html><html lang="mn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Татъя — MP4 / MP3</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#17212d;font:16px system-ui,sans-serif}main{max-width:630px;margin:10vh auto;padding:26px}header{display:flex;align-items:center;gap:12px;margin-bottom:38px}.logo{background:#2563eb;color:white;border-radius:14px;padding:9px 15px;font-size:28px}h1{font-size:26px;margin:0}header p{margin:4px 0;color:#64748b;font-size:14px}.card{background:white;padding:28px;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 12px 40px #18233306}label{display:block;font-size:14px;font-weight:600;margin-bottom:9px}input,select,button,a.download{font:inherit;border-radius:10px;padding:13px}input,select{border:1px solid #cbd5e1;background:white;width:100%;color:inherit}input:focus,select:focus{outline:3px solid #bfdbfe;border-color:#2563eb}button{cursor:pointer;border:0;background:#2563eb;color:white;font-weight:600}button:hover{background:#1d4ed8}button:disabled{opacity:.6;cursor:wait}.linkrow{display:flex;gap:9px}.linkrow input{min-width:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:25px 0}.full{width:100%}.hint,footer{color:#64748b;font-size:13px;line-height:1.65}.hint{margin-top:18px}#title{font-weight:600;line-height:1.5;overflow-wrap:anywhere}#status{font-size:14px;line-height:1.6;overflow-wrap:anywhere;margin-top:16px}progress{width:100%;accent-color:#2563eb;height:10px;margin-top:14px}a.download{display:block;background:#087f5b;color:white;text-decoration:none;text-align:center;margin-top:16px}footer{text-align:center;margin-top:22px}.error{color:#b91c1c}#options[hidden], [hidden]{display:none!important}@media(max-width:480px){main{margin:5vh auto;padding:18px}.card{padding:20px}.linkrow{flex-direction:column}}
</style><main><header><div class="logo">↓</div><div><h1>Татъя</h1><p>YouTube · Facebook · Instagram</p></div></header><section class="card"><form id="form"><label for="url">Бичлэгийн линк</label><div class="linkrow"><input id="url" type="url" placeholder="https://…" required autocomplete="off"><button id="check">Шалгах</button></div></form><div id="options" hidden><p id="title"></p><div class="row"><div><label for="kind">Формат</label><select id="kind"><option value="mp4">MP4 — видео</option><option value="mp3">MP3 — дуу</option></select></div><div><label for="quality">Чанар</label><select id="quality"></select></div></div><button id="start" class="full">Татах</button></div><div id="status" role="status" aria-live="polite"></div><progress id="progress" max="100" value="0" hidden></progress><a id="save" class="download" hidden>Файлаа хадгалах ↓</a><p class="hint">Нийтэд нээлттэй нэг бичлэгийн линк оруулна уу. Хамгийн ихдээ 2 цаг, 500 MB. Файл бэлэн болсноос хойш 1 цаг хадгалагдана.</p></section><footer>Өөрийн болон татаж авах зөвшөөрөлтэй бичлэгт ашиглаарай.<br>MP3-ийн битрейт нь эх дууны чанарыг сайжруулахгүй.</footer></main><script>
const $=id=>document.getElementById(id);let heights=[],checked='',busy=false;
function status(text,error=false){$('status').textContent=text;$('status').className=error?'error':''}
async function api(path,data){const response=await fetch(path,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});let body;try{body=await response.json()}catch{throw Error('Сервер хариу өгөхгүй байна. Дахин оролдоно уу.')}if(!response.ok)throw Error(typeof body.detail==='string'?body.detail:'Хүсэлтийг боловсруулж чадсангүй.');return body}
function qualities(prefer=false){const mp3=$('kind').value==='mp3';$('quality').replaceChildren();for(const q of mp3?[320,192,128]:heights){const o=document.createElement('option');o.value=q;o.textContent=q+(mp3?' kbps':'p');$('quality').append(o)}if(!mp3&&prefer){const preferred=heights.find(h=>h<=720);if(preferred)$('quality').value=preferred}$('start').disabled=busy||!$('quality').options.length}
function lock(value){busy=value;for(const id of ['url','check','kind','quality'])$(id).disabled=value;$('start').disabled=value}
$('kind').onchange=()=>qualities(true);
$('url').oninput=()=>{$('options').hidden=true;$('save').hidden=true;checked='';status('')};
$('form').onsubmit=async e=>{e.preventDefault();lock(true);$('options').hidden=true;$('save').hidden=true;status('Бичлэгийг шалгаж байна…');try{const url=$('url').value.trim();const info=await api('/api/info',{url});checked=url;heights=info.heights;$('title').textContent=info.title;if(!heights.length)$('kind').value='mp3';$('options').hidden=false;status('Формат, чанараа сонгоод татна уу.')}catch(e){status(e.message,true)}finally{lock(false);qualities(true)}};
$('start').onclick=async()=>{if(busy||!checked)return;lock(true);$('save').hidden=true;$('progress').hidden=false;$('progress').value=0;status('Таталтыг эхлүүлж байна…');try{const job=await api('/api/download',{url:checked,kind:$('kind').value,quality:$('quality').value});let state;const deadline=Date.now()+17*60*1000;do{await new Promise(r=>setTimeout(r,1500));state=await api('/api/jobs/'+job.id);$('progress').value=state.progress;status(state.message+(state.status==='working'?' '+Math.round(state.progress)+'%':''));if(state.status==='error')throw Error(state.message);if(Date.now()>deadline)throw Error('Хугацаа дууслаа. Дахин шалгана уу.')}while(state.status!=='done');$('progress').value=100;$('save').href='/api/files/'+job.id;$('save').hidden=false;status('Бэлэн боллоо. Доорх товчоор хадгална уу.')}catch(e){status(e.message,true)}finally{lock(false);qualities()}};
</script></html>
